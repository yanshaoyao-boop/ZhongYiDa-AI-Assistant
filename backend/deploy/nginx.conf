server {
    listen 80;
    # 【必需修改】将下面的 api.yourdomain.com 替换成您真实解析到阿里云的域名，比如 api.zyd.com
    server_name api.yourdomain.com; 
    
    # 强制跳转 HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    # 【必需修改】将下面的 api.yourdomain.com 替换成您真实解析到阿里云的域名
    server_name api.yourdomain.com; 

    # 【必需修改】由于您在火山引擎购买/下载的 SSL 证书，请将它们上传至阿里云 ECS 的 /etc/nginx/ssl/ 目录下，并确保下面两行指向您真实上传的文件名。
    ssl_certificate /etc/nginx/ssl/your_domain.pem;
    ssl_certificate_key /etc/nginx/ssl/your_domain.key;

    # 推荐的 SSL 安全套件配置（防御降级攻击）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 允许用户上传包含复杂表格的大 Excel 文件
    client_max_body_size 50M;

    location / {
        # 代理到 Gunicorn/Uvicorn 的本地服务 (与 bot_api.service 里的端口对应)
        proxy_pass http://127.0.0.1:8000;
        
        # 传递客户端真实 IP，以便日志记录和流量控制
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 【极其关键】针对流式输出 (SSE/Chunked) 的必须配置
        # 这些设置告诉 Nginx 不要自作主张去缓冲数据，来一点发一点，否则打字机效果会变成“憋大招”
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_read_timeout 300s; # 延长超时时间，防止 AI 思考过久断联
    }
}
