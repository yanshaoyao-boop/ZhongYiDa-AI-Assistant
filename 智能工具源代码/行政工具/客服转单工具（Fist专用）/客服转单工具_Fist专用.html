<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客服转单工具 - Fist 专用版</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --secondary: #a855f7;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-strong: rgba(255, 255, 255, 0.08);
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 4rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .tag-exclusive {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .card:hover::before {
            opacity: 1;
        }

        h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        h2 .step-num {
            width: 32px;
            height: 32px;
            background: var(--glass-strong);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        /* File Upload Styling */
        .upload-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .file-input-group {
            position: relative;
        }

        .file-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: var(--glass);
            border: 2px dashed var(--border);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .file-label:hover {
            background: var(--glass-strong);
            border-color: var(--primary);
        }

        .file-label.has-file {
            border-style: solid;
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.05);
        }

        .file-label i {
            font-size: 2rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .file-label span {
            font-weight: 500;
            font-size: 0.95rem;
        }

        .file-label em {
            font-size: 0.8rem;
            color: var(--text-dim);
            font-style: normal;
            margin-top: 0.5rem;
            display: block;
            word-break: break-all;
        }

        input[type="file"] {
            display: none;
        }

        button {
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .btn-primary:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 6px 20px var(--primary-glow);
        }

        .btn-ghost {
            background: var(--glass-strong);
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .btn-ghost:hover:not(:disabled) {
            background: var(--glass);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        /* Mapping UI */
        .mapping-container {
            margin-top: 1rem;
        }

        .mapping-header {
            display: grid;
            grid-template-columns: 2fr 2fr 80px;
            gap: 1rem;
            padding: 0.75rem 1rem;
            background: var(--glass-strong);
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-dim);
            margin-bottom: 0.5rem;
        }

        .mapping-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .mapping-row {
            display: grid;
            grid-template-columns: 2fr 2fr 80px;
            gap: 1rem;
            align-items: center;
            padding: 0.5rem;
            background: var(--glass);
            border-radius: 12px;
            border: 1px solid transparent;
            animation: slideIn 0.3s ease-out;
        }

        .mapping-row:hover {
            border-color: var(--border);
            background: var(--glass-strong);
        }

        select {
            background: var(--bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.6rem;
            border-radius: 8px;
            font-size: 0.9rem;
            width: 100%;
        }

        .btn-remove {
            color: var(--danger);
            background: transparent;
            padding: 0.5rem;
        }

        .btn-remove:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        /* Fixed Rules Info */
        .fixed-rules {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(99, 102, 241, 0.05);
            border-radius: 16px;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .fixed-rules h3 {
            font-size: 0.9rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .fixed-rules ul {
            list-style: none;
            font-size: 0.85rem;
            color: var(--text-dim);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        .fixed-rules li {
            position: relative;
            padding-left: 1.25rem;
        }

        .fixed-rules li::before {
            content: '✦';
            position: absolute;
            left: 0;
            color: var(--primary);
        }

        /* Progress & Status */
        .status-area {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 12px;
            font-size: 0.9rem;
            text-align: center;
        }

        .status-idle { color: var(--text-dim); }
        .status-working { color: var(--primary); }
        .status-success { color: var(--success); }
        .status-error { color: var(--danger); }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: var(--glass-strong);
            border-radius: 3px;
            margin-top: 1rem;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            width: 0%;
            transition: width 0.3s ease;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--glass-strong);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--border);
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <span class="tag-exclusive">Fist Exclusive Tool</span>
            <h1>客服转单工具</h1>
            <p class="subtitle">读取 A 表数据，按模板 B 映射生成。保留原格式、公式与布局。</p>
        </header>

        <div class="grid">
            <!-- Step 1: Upload -->
            <div class="card">
                <h2><span class="step-num">1</span> 选择数据源</h2>
                <div class="upload-section">
                    <div class="file-input-group">
                        <label class="file-label" id="aLabel" for="aFile">
                            <i>📁</i>
                            <span>上传 A 表 (源数据)</span>
                            <em id="aName">未选择文件</em>
                        </label>
                        <input type="file" id="aFile" accept=".xlsx,.xls">
                    </div>
                    <div class="file-input-group">
                        <label class="file-label" id="bLabel" for="bFile">
                            <i>📄</i>
                            <span>上传 B 表 (模板)</span>
                            <em id="bName">未选择文件</em>
                        </label>
                        <input type="file" id="bFile" accept=".xlsx,.xls">
                    </div>
                </div>
                <div style="text-align: center;">
                    <button id="btnRead" class="btn-ghost" disabled>读取并识别字段</button>
                </div>
            </div>

            <!-- Step 2: Mapping -->
            <div class="card" id="mappingCard" style="opacity: 0.5;">
                <div class="actions">
                    <h2><span class="step-num">2</span> 配置映射规则</h2>
                    <div style="display: flex; gap: 0.5rem;">
                        <button id="btnExport" class="btn-ghost" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">导出配置</button>
                        <button id="btnImport" class="btn-ghost" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">导入配置</button>
                        <input type="file" id="importInput" accept=".json" style="display: none;">
                        <button id="btnAddMapping" class="btn-ghost" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">+ 新增映射</button>
                    </div>
                </div>
                
                <div class="mapping-container">
                    <div class="mapping-header">
                        <span>A 表源字段</span>
                        <span>B 表目标单元格</span>
                        <span>操作</span>
                    </div>
                    <div id="mappingList" class="mapping-list">
                        <!-- Rows will be added here -->
                    </div>
                </div>

                <div class="fixed-rules">
                    <h3>内置业务规则 (自动执行)</h3>
                    <ul>
                        <li>收货件数 → B16</li>
                        <li>额外服务 → F6</li>
                        <li>客户单号 → 文件名</li>
                        <li>客户单号+U000001-+收货件数 → A18</li>
                    </ul>
                </div>
            </div>

            <!-- Step 3: Generate -->
            <div class="card" id="generateCard" style="opacity: 0.5;">
                <h2><span class="step-num">3</span> 批量生成</h2>
                <div style="display: flex; flex-direction: column; align-items: center; gap: 1rem;">
                    <button id="btnGenerate" class="btn-primary" style="width: 200px; height: 50px; font-size: 1.1rem;" disabled>一键生成 ZIP</button>
                    <div id="statusMsg" class="status-area status-idle">等待上传文件...</div>
                    <div class="progress-bar-container" id="progressContainer">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Core Application Logic ---
        const state = {
            aWorkbook: null,
            bWorkbookBuffer: null,
            aHeaders: [],
            bTargets: [],
            mappings: [],
            isProcessing: false
        };

        const DOM = {
            aFile: document.getElementById('aFile'),
            bFile: document.getElementById('bFile'),
            aName: document.getElementById('aName'),
            bName: document.getElementById('bName'),
            aLabel: document.getElementById('aLabel'),
            bLabel: document.getElementById('bLabel'),
            btnRead: document.getElementById('btnRead'),
            btnExport: document.getElementById('btnExport'),
            btnImport: document.getElementById('btnImport'),
            importInput: document.getElementById('importInput'),
            btnAddMapping: document.getElementById('btnAddMapping'),
            btnGenerate: document.getElementById('btnGenerate'),
            mappingList: document.getElementById('mappingList'),
            mappingCard: document.getElementById('mappingCard'),
            generateCard: document.getElementById('generateCard'),
            statusMsg: document.getElementById('statusMsg'),
            progressBar: document.getElementById('progressBar'),
            progressContainer: document.getElementById('progressContainer')
        };

        // --- File Handling ---
        DOM.aFile.addEventListener('change', (e) => handleFileSelect(e, 'a'));
        DOM.bFile.addEventListener('change', (e) => handleFileSelect(e, 'b'));

        async function handleFileSelect(e, type) {
            const file = e.target.files[0];
            if (!file) return;

            if (type === 'a') {
                DOM.aName.textContent = file.name;
                DOM.aLabel.classList.add('has-file');
                const buffer = await file.arrayBuffer();
                const workbook = new ExcelJS.Workbook();
                await workbook.xlsx.load(buffer);
                state.aWorkbook = workbook;
                
                const sheet = workbook.worksheets[0];
                const headerRow = sheet.getRow(1);
                state.aHeaders = [];
                headerRow.eachCell({ includeEmpty: false }, (cell) => {
                    const label = cell.value?.toString().trim();
                    const column = cell.address.replace(/[0-9]/g, ''); // Get column letter like 'A', 'B'
                    if (label) {
                        state.aHeaders.push({ label, column });
                    }
                });
            } else {
                DOM.bName.textContent = file.name;
                DOM.bLabel.classList.add('has-file');
                state.bWorkbookBuffer = await file.arrayBuffer();
                
                // Inspect targets from B template
                const workbook = new ExcelJS.Workbook();
                await workbook.xlsx.load(state.bWorkbookBuffer);
                const sheet = workbook.worksheets[0];
                state.bTargets = [];

                // Replicate Python logic for target extraction
                // Labels in A1-A16 -> B1-B16
                for (let r = 1; r <= 16; r++) {
                    const leftLabel = sheet.getCell(`A${r}`).value;
                    if (leftLabel) state.bTargets.push({ label: leftLabel.toString().trim(), cell: `B${r}` });
                    const rightLabel = sheet.getCell(`E${r}`).value;
                    if (rightLabel) state.bTargets.push({ label: rightLabel.toString().trim(), cell: `F${r}` });
                }
                // Labels in Row 17 -> Row 18
                const row17 = sheet.getRow(17);
                row17.eachCell({ includeEmpty: false }, (cell) => {
                    if (cell.col > 1) { // Skip Col A
                        state.bTargets.push({ label: cell.value.toString().trim(), cell: sheet.getRow(18).getCell(cell.col).address });
                    }
                });
            }

            if (state.aWorkbook && state.bWorkbookBuffer) {
                DOM.btnRead.disabled = false;
                updateStatus('文件已就绪，点击“读取并识别字段”开始配置', 'idle');
            }
        }

        DOM.btnRead.addEventListener('click', () => {
            DOM.mappingCard.style.opacity = '1';
            DOM.generateCard.style.opacity = '1';
            DOM.btnGenerate.disabled = false;
            
            removePlaceholderMappings();
            // Try to auto-map based on similar names
            state.bTargets.forEach(target => {
                const match = state.aHeaders.find(h => h.label === target.label || target.label.includes(h.label));
                if (match) {
                    addMappingRow(match.label, target.cell);
                }
            });
            
            updateStatus('字段已读取，你可以根据需要调整映射规则', 'success');
        });

        // --- Mapping Management ---
        function addMappingRow(selectedSource = '', selectedTarget = '') {
            const row = document.createElement('div');
            row.className = 'mapping-row';
            
            const sourceSelect = document.createElement('select');
            sourceSelect.innerHTML = `<option value="">选择 A 表字段</option>` + 
                state.aHeaders.map(h => `<option value="${h.label}" ${h.label === selectedSource ? 'selected' : ''}>${h.label} (${h.column})</option>`).join('');
            
            const targetSelect = document.createElement('select');
            targetSelect.innerHTML = `<option value="">选择 B 表单元格</option>` + 
                state.bTargets.map(t => `<option value="${t.cell}" ${t.cell === selectedTarget ? 'selected' : ''}>${t.label} (${t.cell})</option>`).join('');
            
            const btnRemove = document.createElement('button');
            btnRemove.innerHTML = '✕';
            btnRemove.className = 'btn-remove';
            btnRemove.onclick = () => row.remove();
            
            row.appendChild(sourceSelect);
            row.appendChild(targetSelect);
            row.appendChild(btnRemove);
            DOM.mappingList.appendChild(row);
        }

        function removePlaceholderMappings() {
            DOM.mappingList.innerHTML = '';
        }

        DOM.btnAddMapping.addEventListener('click', () => addMappingRow());

        // --- Config Import/Export ---
        DOM.btnExport.addEventListener('click', () => {
            const mappings = Array.from(DOM.mappingList.querySelectorAll('.mapping-row')).map(row => ({
                source: row.children[0].value,
                target: row.children[1].value
            })).filter(m => m.source && m.target);

            if (mappings.length === 0) {
                alert('当前没有可导出的映射配置');
                return;
            }

            const blob = new Blob([JSON.stringify(mappings, null, 2)], { type: 'application/json' });
            saveAs(blob, `映射配置_${new Date().getTime()}.json`);
        });

        DOM.btnImport.addEventListener('click', () => DOM.importInput.click());

        DOM.importInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            try {
                const text = await file.text();
                const mappings = JSON.parse(text);
                
                if (!Array.isArray(mappings)) throw new Error('无效的配置文件格式');

                removePlaceholderMappings();
                mappings.forEach(m => {
                    addMappingRow(m.source, m.target);
                });
                
                updateStatus('配置导入成功', 'success');
            } catch (err) {
                alert('导入失败: ' + err.message);
            } finally {
                e.target.value = '';
            }
        });

        // --- Generation ---
        DOM.btnGenerate.addEventListener('click', generateZip);

        async function generateZip() {
            if (state.isProcessing) return;
            
            const mappings = Array.from(DOM.mappingList.querySelectorAll('.mapping-row')).map(row => ({
                source: row.children[0].value,
                target: row.children[1].value
            })).filter(m => m.source && m.target);

            state.isProcessing = true;
            DOM.btnGenerate.disabled = true;
            DOM.progressContainer.style.display = 'block';
            updateStatus('正在初始化生成引擎...', 'working');

            const zip = new JSZip();
            const sourceSheet = state.aWorkbook.worksheets[0];
            const rows = [];
            
            // Collect rows starting from index 2
            sourceSheet.eachRow({ includeEmpty: false }, (row, rowNumber) => {
                if (rowNumber > 1) {
                    const rowData = {};
                    state.aHeaders.forEach((hInfo, i) => {
                        // Find the cell by column letter to be safe
                        rowData[hInfo.label] = row.getCell(hInfo.column).value;
                    });
                    rows.push(rowData);
                }
            });

            if (rows.length === 0) {
                updateStatus('未发现有效数据行', 'error');
                state.isProcessing = false;
                DOM.btnGenerate.disabled = false;
                return;
            }

            try {
                for (let i = 0; i < rows.length; i++) {
                    const rowData = rows[i];
                    const progress = Math.round(((i + 1) / rows.length) * 100);
                    DOM.progressBar.style.width = `${progress}%`;
                    updateStatus(`正在处理第 ${i+1}/${rows.length} 份文件...`, 'working');

                    const filenameSource = rowData['客户单号'] || `Row_${i+2}`;
                    const sanitizedName = filenameSource.toString().replace(/[<>:"/\\|?*]+/g, '_');
                    
                    // Create new workbook from template
                    const templateWb = new ExcelJS.Workbook();
                    await templateWb.xlsx.load(state.bWorkbookBuffer);
                    const sheet = templateWb.worksheets[0];

                    // 1. Manual Mappings
                    mappings.forEach(m => {
                        sheet.getCell(m.target).value = rowData[m.source];
                    });

                    // 2. Fixed Rules
                    // Rule: 收货件数 -> B16
                    if (rowData['收货件数']) sheet.getCell('B16').value = rowData['收货件数'];
                    // Rule: 额外服务 -> F6
                    if (rowData['额外服务']) sheet.getCell('F6').value = rowData['额外服务'];
                    // Rule: A18 = {客户单号}U000001-{收货件数}
                    if (rowData['客户单号'] && rowData['收货件数']) {
                        sheet.getCell('A18').value = `${rowData['客户单号']}U000001-${rowData['收货件数']}`;
                    }

                    const outBuffer = await templateWb.xlsx.writeBuffer();
                    zip.file(`${sanitizedName}.xlsx`, outBuffer);
                }

                updateStatus('正在打包 ZIP...', 'working');
                const zipContent = await zip.generateAsync({ type: 'blob' });
                const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
                saveAs(zipContent, `转单结果_${timestamp}.zip`);
                
                updateStatus(`成功生成 ${rows.length} 个文件！`, 'success');
            } catch (err) {
                console.error(err);
                updateStatus(`生成失败: ${err.message}`, 'error');
            } finally {
                state.isProcessing = false;
                DOM.btnGenerate.disabled = false;
                DOM.progressContainer.style.display = 'none';
                DOM.progressBar.style.width = '0%';
            }
        }

        function updateStatus(msg, type) {
            DOM.statusMsg.textContent = msg;
            DOM.statusMsg.className = `status-area status-${type}`;
        }
    </script>
</body>
</html>
