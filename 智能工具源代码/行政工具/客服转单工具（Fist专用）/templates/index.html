<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>客服转单工具 | Fist Exclusive</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="grain"></div>
    <main class="shell">
      <section class="hero">
        <span class="eyebrow">Fist Exclusive Tool</span>
        <h1>客服转单工具<span class="version-tag">PREMIUM</span></h1>
        <p class="hero-copy">
          读取 A 表数据，按模板 B 映射生成。保留原格式、公式与布局，支持批量自动化处理与图片智能插入。
        </p>
      </section>

      <section class="panel upload-panel">
        <div class="section-title">
          <h2>选择数据源</h2>
          <button id="inspectButton" class="ghost-button" type="button" disabled>读取字段</button>
        </div>
        <div class="upload-grid">
          <label class="file-card" id="aFileCard">
            <strong>上传 A 表 (源数据)</strong>
            <span class="file-hint">读取首行字段，逐行生成文件</span>
            <input id="aFile" type="file" accept=".xlsx" />
            <em id="aFileName">未选择文件</em>
          </label>
          <label class="file-card" id="bFileCard">
            <strong>上传 B 表 (模板)</strong>
            <span class="file-hint">用于提取目标位并批量复制</span>
            <input id="bFile" type="file" accept=".xlsx" />
            <em id="bFileName">未选择文件</em>
          </label>
        </div>
        <div id="fileStatus" class="inline-status">
          请先同时选择 A 表和 B 表，随后点击“读取字段”。
        </div>
      </section>

      <section class="panel mapping-panel">
        <div class="section-title">
          <h2>配置字段映射</h2>
          <div class="button-row">
            <button id="addMappingButton" type="button">新增映射</button>
            <button id="exportConfigButton" class="ghost-button" type="button">导出配置</button>
            <label class="ghost-upload">
              <input id="importConfigInput" type="file" accept=".json" />
              导入配置
            </label>
          </div>
        </div>
        <div id="mappingStatus" class="inline-status">
          尚未读取字段。
        </div>

        <div class="mapping-head">
          <span>A 表字段</span>
          <span>B 表字段</span>
          <span>操作</span>
        </div>
        <div id="mappingList" class="mapping-list"></div>
        <p class="tip">
          💡 自动规则：收货件数 → B16 | 额外服务 → F6 | A18 自动构成。
        </p>
      </section>

      <section class="panel image-panel">
        <div class="section-title">
          <h2>智能图片插入 (可选)</h2>
        </div>
        <div class="image-config-grid">
          <label class="file-card" id="imageFileCard">
            <strong>选择图片</strong>
            <span class="file-hint">支持 JPG、PNG 格式</span>
            <input id="imageFile" type="file" accept="image/*" />
            <em id="imageFileName">未选择图片</em>
          </label>
          <div class="image-target-box">
            <p class="file-hint" style="margin-bottom: 12px;">选择插入的目标格子</p>
            <select id="imageTargetSelect" class="target-select">
              <option value="">请先读取字段</option>
            </select>
            <p class="tip" style="margin-top: 16px;">
              图片将按原比例插入到指定格子的左上角。
            </p>
          </div>
        </div>
      </section>

      <section class="panel action-panel">
        <div class="section-title">
          <h2>4. 批量生成</h2>
          <div class="format-selector">
            <span class="file-hint">输出格式：</span>
            <label class="format-option">
              <input type="radio" name="outputFormat" value="xlsx" checked />
              <span>.xlsx</span>
            </label>
            <label class="format-option">
              <input type="radio" name="outputFormat" value="xls" />
              <span>.xls (旧版)</span>
            </label>
          </div>
          <button id="generateButton" class="primary-button" type="button" disabled>执行生成任务</button>
        </div>
        <div id="statusCard" class="status-card">
          <p>等待初始化...</p>
        </div>
        <div id="resultCard" class="result-card hidden"></div>
      </section>
    </main>

    <template id="mappingRowTemplate">
      <div class="mapping-row">
        <select class="source-select">
          <option value="">选择 A 表字段</option>
        </select>
        <select class="target-select">
          <option value="">选择 B 表字段</option>
        </select>
        <button type="button" class="remove-button">删除</button>
      </div>
    </template>

    <script src="/static/app.js"></script>
  </body>
</html>
